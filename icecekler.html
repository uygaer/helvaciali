<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçecekler | Helvacı Ali</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="inner">

    <header class="header">
        <a href="index.html" class="back">← Geri</a>
        <h1 class="logo">İçecekler</h1>
    </header>

    <main class="container">

        <div class="product-list">

            <!-- SICAK İÇECEKLER -->
            <div class="product-card section-title">
                <div class="product-info">
                    <h3>SICAK İÇECEKLER</h3>
                </div>
            </div>

            <div class="product-card drink-item">
                <div class="product-info">
                    <h3>Çay</h3>
                </div>
                <span class="price">15₺</span>
            </div>

            <div class="product-card drink-item">
                <div class="product-info">
                    <h3>Kahve</h3>
                </div>
                <span class="price">40₺</span>
            </div>


            <!-- SOĞUK İÇECEKLER -->
            <div class="product-card section-title" style="margin-top: 10px;">
                <div class="product-info">
                    <h3>SOĞUK İÇECEKLER</h3>
                </div>
            </div>

            <div class="product-card drink-item">
                <div class="product-info">
                    <h3>Su</h3>
                </div>
                <span class="price">20₺</span>
            </div>

            <div class="product-card drink-item">
                <div class="product-info">
                    <h3>Meyveli Soda</h3>
                </div>
                <span class="price">40₺</span>
            </div>

            <div class="product-card drink-item">
                <div class="product-info">
                    <h3>Kola (Kutu)</h3>
                </div>
                <span class="price">70₺</span>
            </div>

            <div class="product-card drink-item">
                <div class="product-info">
                    <h3>Sprite (Kutu)</h3>
                </div>
                <span class="price">70₺</span>
            </div>

            <div class="product-card drink-item">
                <div class="product-info">
                    <h3>Fanta (Kutu)</h3>
                </div>
                <span class="price">70₺</span>
            </div>

        </div>

    </main>

</body>
</html>
